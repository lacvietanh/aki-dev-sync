[package]
name = "aki-dev-sync"
version = "1.21.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "aki_dev_sync_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6.0.0"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
base64 = "0.22.1"
# Remote Control relay (docs/plan/done/remote-control.md §7) — new deps, this feature only.
axum = { version = "0.7", features = ["ws"] }
tokio = { version = "1", features = ["net", "sync", "macros", "time"] }
tower-http = { version = "0.5", features = ["cors"] }
if-addrs = "0.13"
getrandom = "0.2"
# §7.2 (PORT-1) dev-mode reverse proxy to Vite. TLS stripped — every request it makes is to
# 127.0.0.1, never a remote/https host. (No HMR websocket bridge: HMR stays direct to Vite.)
reqwest = { version = "0.12", default-features = false }
# In-app terminal (docs/plan/1.20.0-terminal-and-remote-sync.md §4, T-1) — the only battle-tested
# cross-platform PTY crate; ships on Apple Silicon in wezterm itself. tauri-plugin-shell has no PTY.
portable-pty = "0.9"

# `killpg` for the in-app terminal's teardown (see pty.rs::kill_process_group). Already in the
# lockfile transitively; declared explicitly because this crate calls it directly. unix-only —
# there is no `killpg` on Windows, and that path falls back to `Child::kill()`.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
incremental = false
opt-level = "s"
strip = true

[profile.dev]
split-debuginfo = "unpacked"

[profile.dev.package.miniz_oxide]
opt-level = 3

