[package]
name = "aki-dev-sync"
version = "1.34.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# `_lib` keeps the lib name distinct from the bin name (a Windows clash, https://github.com/rust-lang/cargo/issues/8519).
name = "aki_dev_sync_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6.0.0"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
base64 = "0.22.1"
# Remote Control relay (docs/plan/done/remote-control.md §7) — new deps, this feature only.
axum = { version = "0.7", features = ["ws"] }
tokio = { version = "1", features = ["net", "sync", "macros", "time", "io-util"] }
if-addrs = "0.13"
getrandom = "0.2"
# §7.2 (PORT-1) dev-mode reverse proxy to Vite. TLS stripped — every request it makes is to
# 127.0.0.1, never a remote/https host. (No HMR websocket bridge: HMR stays direct to Vite.)
reqwest = { version = "0.12", default-features = false }
# In-app terminal PTY (tauri-plugin-shell has none); the cross-platform crate wezterm ships (docs/plan/done/1.20.0-terminal-and-remote-sync.md §4).
portable-pty = "0.9"

# `killpg` for the terminal's process-group teardown (pty.rs::kill_process_group); Windows falls back to `Child::kill()`.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# keep_awake.rs: the per-OS throttling opt-outs; every crate is already in the tree through wry/tao.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSProcessInfo", "NSString"] }
objc2-web-kit = { version = "0.3", default-features = false, features = ["std", "objc2-app-kit", "WKWebView", "WKWebViewConfiguration", "WKPreferences"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Threading"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
incremental = false
opt-level = "s"
strip = true

[profile.dev]
split-debuginfo = "unpacked"

[profile.dev.package.miniz_oxide]
opt-level = 3

